[package]
name = "jwk-cache"
version = "0.1.0"
edition = "2024"
description = "A crate to resiliantly cache JWKs from multiple OIDC Identity Providers"
readme = "README.md"
repository = "https://github.com/calteran/jwk-cache"
license = "MIT OR Apache-2.0"
keywords = ["jwk", "jsonwebtoken", "oidc", "cache"]
categories = ["authentication", "caching", "web-programming"]

[features]
default = ["tracing"]
tracing = ["dep:tracing", "tokio/tracing"]

[dependencies]
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.14", features = ["json"] }
scc = "2.3.3"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
tracing = { version = "0.1.41", optional = true }
